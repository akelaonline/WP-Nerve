name: Build plugin archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and verify reproducible WordPress archive
        run: bash scripts/build-release.sh

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp-nerve-release-${{ github.ref_name }}
          path: |
            dist/wp-nerve-*.zip
            dist/SHA256SUMS
            dist/RELEASE-MANIFEST.txt
          if-no-files-found: error
